name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: youtube_downloader
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            youtube_downloader/requirements.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate add-on manifest and translations
        run: python youtube_downloader/scripts/validate_addon.py

      - name: Validate canonical version
        run: python youtube_downloader/scripts/bump_version.py --check

      # The repository predates this CI workflow and contains legacy style debt.
      # Keep repository-wide checks focused on correctness while enforcing the
      # complete configured Ruff rules for Python files changed by each PR/push.
      - name: Ruff critical checks for repository
        run: >-
          ruff check --select E9,F63,F7,F82
          youtube_downloader/app youtube_downloader/tests youtube_downloader/scripts

      - name: Resolve changed Python files
        id: changed-python
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BASE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=ACMRT "${base_sha}" HEAD \
            | grep -E '^youtube_downloader/.*\.py$' \
            > changed-python.txt || true
          if [[ -s changed-python.txt ]]; then
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
            echo "Zmienione pliki Python:"
            cat changed-python.txt
          else
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
            echo "Brak zmienionych plików Python."
          fi

      - name: Ruff lint changed Python files
        if: steps.changed-python.outputs.has_files == 'true'
        run: xargs -r ruff check < changed-python.txt

      - name: Ruff format changed Python files
        if: steps.changed-python.outputs.has_files == 'true'
        run: xargs -r ruff format --check < changed-python.txt

      - name: Mypy hardening service modules
        run: >-
          mypy
          youtube_downloader/app/services/hardening.py
          youtube_downloader/app/services/job_state.py

      # main.py intentionally binds the development entry point to 0.0.0.0 so
      # the Home Assistant container can expose it. Scan the new security code
      # here instead of suppressing Bandit's B104 globally.
      - name: Bandit hardening service modules
        run: >-
          bandit -q
          youtube_downloader/app/services/hardening.py
          youtube_downloader/app/services/job_state.py

      - name: Unit and regression tests
        run: python -m unittest discover -s youtube_downloader/tests -p "test_*.py" -v

  container-build:
    name: Build ${{ matrix.platform }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: youtube_downloader
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=1.3.101
