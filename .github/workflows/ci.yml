name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: youtube_downloader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            youtube_downloader/requirements.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate add-on manifest and translations
        run: python youtube_downloader/scripts/validate_addon.py

      - name: Validate canonical version
        run: python youtube_downloader/scripts/bump_version.py --check

      # The repository predates this CI workflow and contains legacy style debt.
      # Keep repository-wide checks focused on correctness while enforcing the
      # complete configured Ruff rules for Python files changed by this PR.
      - name: Ruff critical checks for repository
        run: >-
          ruff check --select E9,F63,F7,F82
          youtube_downloader/app youtube_downloader/tests youtube_downloader/scripts

      - name: Ruff lint changed Python files
        run: >-
          ruff check
          youtube_downloader/app/main.py
          youtube_downloader/app/services/hardening.py
          youtube_downloader/app/services/job_state.py
          youtube_downloader/tests/test_hardening.py

      - name: Ruff format changed Python files
        run: >-
          ruff format --check
          youtube_downloader/app/main.py
          youtube_downloader/app/services/hardening.py
          youtube_downloader/app/services/job_state.py
          youtube_downloader/tests/test_hardening.py

      - name: Mypy changed service modules
        run: >-
          mypy
          youtube_downloader/app/services/hardening.py
          youtube_downloader/app/services/job_state.py

      # main.py intentionally binds the development entry point to 0.0.0.0 so
      # the Home Assistant container can expose it. Scan the new security code
      # here instead of suppressing Bandit's B104 globally.
      - name: Bandit changed service modules
        run: >-
          bandit -q
          youtube_downloader/app/services/hardening.py
          youtube_downloader/app/services/job_state.py

      - name: Unit and regression tests
        run: python -m unittest discover -s youtube_downloader/tests -p "test_*.py" -v

  container-build:
    name: Build ${{ matrix.platform }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: youtube_downloader
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=1.3.101
