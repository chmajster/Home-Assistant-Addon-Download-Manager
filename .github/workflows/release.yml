name: Release validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve canonical version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python youtube_downloader/scripts/bump_version.py --check --expected "${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            python youtube_downloader/scripts/bump_version.py --check
            VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('youtube_downloader/config.yaml').read_text(encoding='utf-8')
          print(re.search(r'^version:\s*"([^"]+)"', text, re.MULTILINE).group(1))
          PY
          )"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image for supported architectures
        uses: docker/build-push-action@v6
        with:
          context: youtube_downloader
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
